[project]
name = "open-vocab-mot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aidan Dempster", email = "aidan.dempster@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aidan-lib[sam3-research,transnet,compiled_dino]",
    "pillow>=12.2.0",
    "torch==2.9.1",
    "jaxtyping>=0.3.9",
    "torchvision>=0.24.1",
    "awkward>=2.9.0",
    "wandb>=0.27.0",
    "accelerate>=1.13.0",
    "wildlife-datasets>=1.0.8",
    "hydra-core>=1.3.2",
    "pydantic>=2.13.4",
    "kaggle==1.8.4",
    "kagglehub>=1.0.1",
    "kagglesdk==0.1.22",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[project.optional-dependencies]
dev = [
    "ipykernel>=7.2.0",
    "nvitop>=1.7.0",
]

[tool.uv.sources]
aidan-lib = { git = "https://github.com/Veldrovive/aidan-lib.git" }
