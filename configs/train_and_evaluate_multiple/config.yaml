epochs: 10
batches_per_epoch: 500
lr: 1.0e-4
frame_loss_weight: 0.5
cross_loss_weight: 0.35
seed: 42
dino_checkpoint: "facebook/dinov3-vitl16-pretrain-lvd1689m"
dino_batch_split: 4

device: "cuda"
cuda_visible_devices: null

checkpoint_path: "weights/reid_transformer_latest.pt"
plot_path: "weights/loss_curve.png"

num_embeddings: 3
compute_eval_loss: true
compute_eval_accuracy: true
eval_loss_batches: 15
eval_max_embeddings: 1000
mini_eval_max_frame_embeddings: 1
eval_batch_size: 32

wandb_project: "open-vocab-mot-tests"
wandb_name: "cross-loss"
wandb_entity: null
no_wandb: false
run_initial_mini_eval: true

use_nested_tensors: false
frame_transformer_dim: 1024
frame_contrastive_dim: 256
frame_num_heads: 8
frame_num_layers: 5
video_transformer_dim: 512
video_contrastive_dim: 256
video_num_heads: 4
video_num_layers: 3
dropout: 0.05

