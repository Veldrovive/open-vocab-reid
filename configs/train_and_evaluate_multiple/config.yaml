# frame_num_layers: 3
# video_transformer_dim: 256
# video_contrastive_dim: 256
# video_num_heads: 4
# video_num_layers: 3
# dropout: 0.1

duke:
  use_for_training: true
  weight: 1.0
  frames_per_video: 8
  people_per_batch: 16
  views_per_person: 4
  use_for_video_eval: true
  use_for_video_mini_eval: true
  use_for_frame_eval: false
  use_for_frame_mini_eval: false

whale:
  use_for_training: true
  weight: 0.2
  frames_per_video: 4
  people_per_batch: 16
  views_per_person: 2
  min_num_images: 8
  use_for_video_eval: true
  use_for_video_mini_eval: false
  use_for_frame_eval: false
  use_for_frame_mini_eval: false

