    use_for_video_mini_eval: true
    use_for_frame_eval: false
    use_for_frame_mini_eval: false

  - subset_dataset: 'DogFaceNet'
    use_for_training: true
    weight: 0.2
    frames_per_video: 4
    people_per_batch: 16
    views_per_person: 2
    min_num_images: 8
    use_for_video_eval: false
    use_for_video_mini_eval: false
    use_for_frame_eval: false
    use_for_frame_mini_eval: false

  - subset_dataset: 'SeaTurtleID2022'
    use_for_training: true
    weight: 0.2
    frames_per_video: 4
    people_per_batch: 16
    views_per_person: 2
    min_num_images: 8
    use_for_video_eval: true
    use_for_video_mini_eval: false
    use_for_frame_eval: false
    use_for_frame_mini_eval: false

  - subset_dataset: 'NyalaData'
    use_for_training: true
    weight: 0.2
    frames_per_video: 4
    people_per_batch: 16
    views_per_person: 2
    min_num_images: 8
    use_for_video_eval: false
    use_for_video_mini_eval: false
    use_for_frame_eval: false
